[package]
name = "vat-mtd"
version = "0.1.6"
edition = "2024"
rust-version = "1.85"
description = "HMRC Making Tax Digital VAT bridge — the typed submit/obligations contract, fraud-prevention headers, and the mapping from vat-return boxes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/vat-mtd"
keywords = ["hmrc", "mtd", "vat", "accounting", "finance"]
categories = ["finance", "api-bindings"]

[dependencies]
vat-return = "=0.1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
